# 项目名必须显式指定：Compose 默认从目录名推导，
# 而本目录名是中文（会议纪要服务），规范化后为空 → 报 "project name must not be empty"
name: meeting_minutes

services:
  app:
    build:
      # 上下文必须是仓库根，才能把根目录的 tools/ 打进镜像（版式单一真源）
      context: ..
      dockerfile: 会议纪要服务/Dockerfile
    image: meeting-svc:0.4.0
    restart: unless-stopped
    env_file: .env
    volumes:
      # 用「命名卷」而不是 ./data 绑定挂载：
      # 绑定挂载时宿主机目录由 Docker 以 root 创建，容器内 app(uid 10001) 无法写入，
      # 会报 PermissionError: '/data/home'。命名卷会把镜像里 /data 的属主(10001)带过来。
      # 想在宿主机直接看文件，见部署说明「查看/清理数据」一节。
      - appdata:/data
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"          # 只给 caddy，不映射到宿主机
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # 证书与站点地址，来自 .env 的 SITE_ADDR（缺省用公网 IP）
      SITE_ADDR: ${SITE_ADDR:-localhost}
    ports:
      - "8081:8081"     # 公网唯一入口（自签 HTTPS）
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:            # 任务数据与成品（1 小时后自动清理）
  caddy_data:
  caddy_config:
